<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ICTHub — M.Sc. Eng. in ICT @ IICT, KUET</title>
    <meta
      name="description"
      content="Study portal for M.Sc. Eng. in ICT students at IICT, Khulna University of Engineering & Technology"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#176b5b" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved/device theme before first paint so dark-mode users never see a white flash.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("icthub:theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0e1513" : "#176b5b";
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ICTHub" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <noscript>ICTHub needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
